name: zaveit

services:
  server:
    build: .
    container_name: zaveit-server
    restart: unless-stopped
    env_file: .env
    environment:
      # The gitignored service-account key, mounted read-only; overrides the ./keys path .env uses for `go run`.
      FIREBASE_SERVICE_ACCOUNT_KEY_FILE: /keys/zaveit-admin.json
    volumes:
      - ./keys:/keys:ro
    networks: [web]

networks:
  web:
    external: true